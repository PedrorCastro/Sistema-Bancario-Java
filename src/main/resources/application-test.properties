# ===================================================================
# Perfil de Testes Automatizados (H2 em Memoria)
# Permite rodar 'mvn test' rapidamente sem exigir container ativo
# ===================================================================
spring.datasource.url=jdbc:h2:mem:bancodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
