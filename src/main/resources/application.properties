# ===================================================================
# Configuracao da Aplicacao - Sistema Bancario Java
# ===================================================================
spring.application.name=Sistema-Bancario-Java

# ===================================================================
# Conexao com PostgreSQL (Docker Container)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bancodb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===================================================================
# Configuracoes do Hibernate / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

#====================================================================
# Definir porta da API
#====================================================================

server.port=8080

