# ===================================================================
# Configuracao da Aplicacao - Sistema Bancario Java
# ===================================================================
spring.application.name=Sistema-Bancario-Java

# Carrega as variaveis do arquivo .env (se existir) na raiz do projeto
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Conexao com PostgreSQL (Docker Container)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bancodb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===================================================================
# Configuracoes do Hibernate / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#====================================================================
# Definir porta da API
#====================================================================
server.port=8080

#====================================================================
# Configuracoes JWT
#====================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

#====================================================================
# Configuracoes de cabecalhos para proxy reverso (ex: Nginx)
#====================================================================
server.forward-headers-strategy=framework


#====================================================================
# CORS - origens de navegador autorizadas a chamar a API
#====================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}